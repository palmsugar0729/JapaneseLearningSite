# jplearning.palmsugar.cn 站点配置
# 说明：SSL 相关行由 certbot 自动管理，其余为手动配置。
server {
    server_name jplearning.palmsugar.cn;

    # 前端静态文件（dist 上传后的位置）
    root /opt/japanese-learning/JapaneseLearningSite/codes/web/dist;
    index index.html;

    access_log /var/log/nginx/japanese-access.log;
    error_log  /var/log/nginx/japanese-error.log;

    # 压缩 JS/CSS/JSON 等文本资源（nginx 默认只压 text/html，这里显式补全）
    gzip_types text/html text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;

    # API 反代到 Node.js 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 带 hash 的静态资源：长期缓存（Vite 文件名含内容 hash，可安全 immutable）
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA 前端：找不到的文件回退到 index.html（Vue Router 需要）
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jplearning.palmsugar.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jplearning.palmsugar.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = jplearning.palmsugar.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name jplearning.palmsugar.cn;
    return 404; # managed by Certbot

}
